[workspace]
# The fistbump-bridge binary lives in its own crate so Tauri's bundler
# only picks up the wallet binary. If we put it under src/bin/ here,
# Cargo would treat it as a second binary target of this package and
# Tauri would end up bundling it as Contents/MacOS/fistbump-bridge,
# clobbering the actual wallet binary slot.
members = ["bridge"]

[package]
name = "fistbump"
version = "0.1.0"
edition = "2021"

[lib]
name = "fistbump"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2"
dirs = "5"
open = "5"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
x509-parser = "0.16"
sha2 = "0.10"
time = "0.3"
webpki-roots = "1"
ring = "0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
